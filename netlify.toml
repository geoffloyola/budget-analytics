# Netlify detects Next.js and applies its adapter automatically; this file
# only pins the build so it doesn't change under us.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # The Supabase URL and anon key are public by design: Next.js inlines
  # NEXT_PUBLIC_* values into the browser bundle, and row-level security is
  # what protects the data. Everything else, above all
  # SUPABASE_SERVICE_ROLE_KEY and ANTHROPIC_API_KEY, stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL"
